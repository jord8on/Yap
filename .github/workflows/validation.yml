name: Security validation (macOS + backend)

# Run security-relevant tests in GitHub's isolated runners, not on a user's
# primary Mac. This complements the existing OSV/Semgrep/gitleaks workflow.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yap-security-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-auth:
    name: Python authentication regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test-only requirements
        run: python -m pip install --disable-pip-version-check --no-cache-dir pytest fastapi numpy
      - name: Validate Python syntax and authentication
        env:
          YAP_AUTH_TOKEN_FILE: ${{ runner.temp }}/yap-auth-ci-token
        run: |
          python -m py_compile backend/server.py backend/pocket_engine.py backend/tests/test_auth.py
          cd backend
          python -m pytest tests/test_auth.py -v

  macos-swift:
    name: Swift package compile and focused regression tests
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build Swift executable and XCTest target
        run: swift build --package-path app --build-tests
      - name: Run fake-backend credential regression if present
        run: |
          if test -f app/Tests/YapTests/BackendAuthenticationTests.swift; then
            swift test --package-path app --filter BackendAuthenticationTests
          fi
      - name: Run history opt-in regression if present
        run: |
          if test -f app/Tests/YapTests/HistoryOptInTests.swift; then
            swift test --package-path app --filter HistoryOptInTests
          fi
      - name: Shell syntax on bundled Python runtime builder
        run: bash -n scripts/bundle_python.sh
