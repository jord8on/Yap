name: Hardening source checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Start source receipt
        shell: bash
        run: |
          RECEIPTS="$RUNNER_TEMP/yap-source-receipts"
          printf 'RECEIPTS=%s\n' "$RECEIPTS" >> "$GITHUB_ENV"
          mkdir -p "$RECEIPTS"
          printf 'checkout_target=%s\npr_head=%s\npr_base=%s\n' \
            "$GITHUB_SHA" "$PR_HEAD_SHA" "$PR_BASE_SHA" > "$RECEIPTS/source.txt"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 commit
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check source and record toolchain and lock digests
        shell: bash
        run: |
          set -euo pipefail
          {
            actual="$(git rev-parse HEAD)"
            printf 'source_sha=%s\n' "$actual"
            test "$actual" = "$GITHUB_SHA"
            uname -a
            cat /etc/os-release
            python3 --version
            bash --version
            sha256sum app/Package.resolved scripts/python_pin.sh backend/requirements*.txt
            set -x
            git diff --check "$PR_BASE_SHA" HEAD
            git ls-files -z -- 'scripts/*.sh' scripts/yap | while IFS= read -r -d '' script; do
              bash -n "$script"
            done
            python3 -I -B tests/security_static/test_policy.py
          } 2>&1 | tee "$RECEIPTS/checks.log"
      - name: Record source check status
        if: always()
        shell: bash
        env:
          STATUS: ${{ job.status }}
        run: |
          printf 'source_job_status=%s\n' "$STATUS" >> "$RECEIPTS/source.txt"
          printf '%s\n' 'Runtime tests, advisory/code/secret scans, and release checks were not run.' >> "$RECEIPTS/source.txt"
      - name: Upload source receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yap-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RECEIPTS }}
          if-no-files-found: error
          retention-days: 7
